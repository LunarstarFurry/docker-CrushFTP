name: Docker

on:
  push:
    branches: [ "alpine" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "alpine" ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: lunarstarfurry/crushftp11-alpine
  # This opts you into Node 24 immediately to clear the warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4 is still fine, but check for v5 soon

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # Updated to v3.8.0 (current stable)
        uses: sigstore/cosign-installer@dcced6c7c006093ca2d233c7f9996919
        with:
          cosign-release: 'v2.4.1'

      - name: Set up Docker Buildx
        # Updated to v3.10.0
        uses: docker/setup-buildx-action@b167a82f6e91f0a1c6a2fa71e0c20188
        
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        # Updated to v3.3.0
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18
        with:
          registry: ${{ env.REGISTRY }}
          username: lunarstarfurry
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        # Updated to v5.7.0
        uses: docker/metadata-action@369ebfd12c9b4e7240c976f95761a668
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        # Updated to v6.15.0 (Node 24 native)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
